version: 2

models:
  - name: dim_customer
    description: Customer dimension containing customer identifiers and geographic information used across the dimensional warehouse.

    columns:
      - name: customer_sk
        description: Surrogate key for the customer dimension.
        tests:
          - unique
          - not_null

      - name: customer_id
        description: Business key identifying the customer record for a specific order.
        tests:
          - not_null

      - name: customer_unique_id
        description: Business identifier representing the actual customer across multiple orders.
        tests:
          - not_null

      - name: state
        description: State where the customer is located.
        tests:
          - not_null

      - name: city
        description: City where the customer is located.
        tests:
          - not_null

      - name: zip_code_prefix
        description: ZIP code prefix of the customer's location.
        tests:
          - not_null

      - name: latitude
        description: Latitude of the customer's location.

      - name: longitude
        description: Longitude of the customer's location.

  - name: dim_geography
    description: Geography dimension containing standardized geographic information used across the dimensional warehouse.

    columns:
      - name: geography_sk
        description: Surrogate key for the geography dimension.
        tests:
          - unique
          - not_null

      - name: state
        description: State where the location is situated.
        tests:
          - not_null

      - name: city
        description: City where the location is situated.
        tests:
          - not_null

      - name: zip_code_prefix
        description: ZIP code prefix of the location.
        tests:
          - not_null

      - name: latitude
        description: Latitude of the geographic location.

      - name: longitude
        description: Longitude of the geographic location.

  - name: dim_product
    description: Product dimension containing product attributes used for commercial and product performance reporting.

    columns:
      - name: product_sk
        description: Surrogate key for the product dimension.
        tests:
          - unique
          - not_null

      - name: product_id
        description: Business key identifying the product.
        tests:
          - not_null

      - name: product_category_name
        description: Product category in Portuguese.

      - name: product_category_name_english
        description: Product category translated into English.

      - name: product_name_length
        description: Number of characters in the product name.

      - name: product_description_length
        description: Number of characters in the product description.

      - name: product_photos_qty
        description: Number of product photos.

      - name: product_weight_g
        description: Product weight in grams.

      - name: product_length_cm
        description: Product length in centimeters.

      - name: product_height_cm
        description: Product height in centimeters.

      - name: product_width_cm
        description: Product width in centimeters.

  - name: dim_seller
    description: Seller dimension containing seller information and geographic attributes.

    columns:
      - name: seller_sk
        description: Surrogate key for the seller dimension.
        tests:
          - unique
          - not_null

      - name: seller_id
        description: Business key identifying the seller.
        tests:
          - not_null

      - name: state
        description: State where the seller is located.
        tests:
          - not_null

      - name: city
        description: City where the seller is located.
        tests:
          - not_null

      - name: zip_code_prefix
        description: ZIP code prefix of the seller's location.
        tests:
          - not_null

      - name: latitude
        description: Latitude of the seller's location.

      - name: longitude
        description: Longitude of the seller's location.

  - name: dim_date
    description: Date dimension providing calendar attributes for business reporting.

    columns:
      - name: date_sk
        description: Surrogate key for the date dimension in YYYYMMDD format.
        tests:
          - unique
          - not_null

      - name: calendar_date
        description: Calendar date.
        tests:
          - unique
          - not_null

      - name: year
        description: Calendar year.
        tests:
          - not_null

      - name: quarter
        description: Calendar quarter.
        tests:
          - not_null

      - name: month
        description: Calendar month number.
        tests:
          - not_null

      - name: month_name
        description: Calendar month name.
        tests:
          - not_null

      - name: week
        description: Calendar week number.
        tests:
          - not_null

      - name: day
        description: Day of the month.
        tests:
          - not_null

      - name: day_name
        description: Name of the day of the week.
        tests:
          - not_null

      - name: day_of_week
        description: Day of the week represented as a number.
        tests:
          - not_null

      - name: is_weekend
        description: Indicates whether the date falls on a weekend.
        tests:
          - not_null